{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Project | Forge</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>📂 Add Project</h1>

        <p>Every great build starts with a single task.</p>

    </div>

    <div class="card">

        <h2>🚀 New Project</h2>

        <form method="POST">

            {% csrf_token %}

            <label>Project Title</label>

            <input
                type="text"
                name="title"
                placeholder="Enter project title..."
                required
            >

            <label>Description</label>

            <textarea
                name="description"
                rows="5"
                placeholder="Describe your project..."
            ></textarea>

            <button class="btn btn-primary" type="submit">
                Save Project
            </button>

        </form>

    </div>

</div>

</body>
</html>
