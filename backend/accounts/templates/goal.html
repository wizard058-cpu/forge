{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Add Goal - Forge</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎯 Add Goal</h1>

        <p>Create your next mission.</p>

    </div>

    <div class="card">

    <h2>🎯 New Mission</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Mission Title</label>

        <input
            type="text"
            name="title"
            placeholder="Enter your next mission..."
            required
        >

        <br><br>

        <button class="btn btn-primary" type="submit">
            Save Goal
        </button>

    </form>

</div>

</div>

</body>

</html>
